<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo navy -->
  <rect width="100" height="100" rx="16" fill="#070f2b"/>

  <!-- Borda sutil indigo -->
  <rect width="100" height="100" rx="16" fill="none" stroke="#535c91" stroke-width="3"/>

  <!-- Canto cortado (chamfer) bottom-right -->
  <polygon points="80,100 100,80 100,100" fill="#9290c3"/>

  <!-- Texto LS em lavender -->
  <text
    x="50"
    y="52"
    font-family="Arial, sans-serif"
    font-weight="bold"
    font-size="46"
    fill="#9290c3"
    text-anchor="middle"
    dominant-baseline="central"
  >LS</text>
</svg>
