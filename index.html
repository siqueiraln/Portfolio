      { "@type": "Question", "name": "O que é um parceiro de tecnologia para empresas?", "acceptedAnswer": { "@type": "Answer", "text": "Um parceiro de tecnologia é um profissional que resolve tudo que é tecnologia do seu negócio sem você precisar contratar um setor de TI interno. Isso inclui criar sites e sistemas, automatizar processos repetitivos, dar suporte técnico, orientar na compra de equipamentos e indicar quais ferramentas e assinaturas realmente valem para sua empresa." } },
      { "@type": "Question", "name": "Quais serviços de tecnologia você oferece para empresas?", "acceptedAnswer": { "@type": "Answer", "text": "Ofereço cinco serviços: (1) Desenvolvimento web — sites, landing pages e sistemas; (2) Automação de processos com n8n e IA — elimina tarefas manuais e integra sistemas; (3) Consultoria de serviços online — orientação sobre quais ferramentas e assinaturas SaaS fazem sentido para seu negócio; (4) Consultoria de hardware — indicação de equipamentos e busca de melhores preços nos maiores marketplaces; (5) Manutenção de computadores — formatação, limpeza, upgrades e suporte técnico." } },
      { "@type": "Question", "name": "Você atende presencialmente em Simão Dias, SE?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Faço atendimento presencial em Simão Dias e região — ideal para manutenção de computadores, instalação de equipamentos e reuniões de briefing para projetos web ou de automação. Para projetos que não exigem presença física, atendo remotamente em todo o Brasil." } },
      { "@type": "Question", "name": "Quanto custa criar um site para minha empresa?", "acceptedAnswer": { "@type": "Answer", "text": "O valor depende do escopo: uma landing page simples custa menos do que um sistema completo de agendamento ou e-commerce. Para dar um orçamento preciso, preciso entender o que você precisa — qual o objetivo do site, se precisa de formulários, área de membros, integração com WhatsApp etc. Entre em contato pelo WhatsApp e me conta o projeto; respondo com prazo e valor no mesmo dia." } },
      { "@type": "Question", "name": "Como a automação de processos pode ajudar minha empresa?", "acceptedAnswer": { "@type": "Answer", "text": "Automação elimina tarefas repetitivas que consomem tempo da sua equipe. Exemplos práticos: envio automático de confirmações e cobranças por WhatsApp, sincronização de pedidos entre sistemas, geração de relatórios sem intervenção manual, respostas automáticas a clientes fora do horário, e publicação de conteúdo em redes sociais. Uso n8n e inteligência artificial para montar esses fluxos — você configura uma vez e a máquina trabalha enquanto você cuida do negócio." } },
      { "@type": "Question", "name": "Você faz manutenção de computadores em Simão Dias?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Faço formatação, limpeza de vírus, troca de pasta térmica, upgrade de memória RAM e SSD, recuperação de dados e diagnóstico geral de hardware e software. Atendo em Simão Dias e municípios da região. Para empresas com mais de um computador, também ofereço suporte técnico recorrente." } },
      { "@type": "Question", "name": "Como funciona a consultoria de hardware?", "acceptedAnswer": { "@type": "Answer", "text": "Você me conta o que precisa — computador, impressora, roteador, câmera de segurança, ou qualquer outro equipamento — e qual é o seu orçamento. Eu analiso as opções disponíveis, indico o modelo com melhor custo-benefício para o seu uso específico e faço a busca de preço nos maiores marketplaces do Brasil (Mercado Livre, Amazon, Magalu, etc.) para garantir que você pague menos. Evita compra errada e dinheiro desperdiçado." } },
      { "@type": "Question", "name": "O que é consultoria de serviços online e como pode me ajudar?", "acceptedAnswer": { "@type": "Answer", "text": "Muitas empresas pagam por ferramentas que não usam corretamente ou contratam vários sistemas que fazem a mesma coisa. A consultoria de serviços online analisa o que você já usa, o que realmente precisa e recomenda as melhores opções — seja para gestão, comunicação, vendas, finanças ou marketing. O objetivo é reduzir custos com assinaturas desnecessárias e garantir que cada ferramenta trabalhe a favor do seu negócio." } },
      { "@type": "Question", "name": "Qual o prazo para entregar um site ou sistema?", "acceptedAnswer": { "@type": "Answer", "text": "Uma landing page simples fica pronta em 3 a 5 dias úteis. Um site institucional completo leva entre 1 e 2 semanas. Sistemas mais complexos — como plataformas de agendamento, áreas de membros ou integrações com múltiplos serviços — têm prazo definido no briefing, geralmente entre 2 e 6 semanas. Sempre trabalho com entregas parciais para você acompanhar o progresso." } },
