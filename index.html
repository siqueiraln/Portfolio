  <style>
    body { font-family: 'Inter', sans-serif; }

    /* ── Gaming clip-path helpers ── */
    .clip-chamfer {
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }
    .clip-notch {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    .clip-badge {
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }
    .clip-chamfer-sm {
      clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar       { width: 6px; }
    ::-webkit-scrollbar-track { background: #070f2b; }
    ::-webkit-scrollbar-thumb { background: #535c91; }
    ::-webkit-scrollbar-thumb:hover { background: #9290c3; }

    /* ── Hero entrance animations ── */
    @keyframes heroSlideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroSlideRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Scroll reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1),
                  transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.from-left  { transform: translateX(-28px); }
    .reveal.from-right { transform: translateX(28px); }
    .reveal.fade-only  { transform: none; }
    .reveal.visible {
      opacity: 1;
      transform: translate(0, 0);
    }
    .delay-100 { transition-delay: 0.1s; }
    .delay-200 { transition-delay: 0.2s; }
    .delay-300 { transition-delay: 0.3s; }
    .delay-400 { transition-delay: 0.4s; }
    .delay-500 { transition-delay: 0.5s; }

    /* ── Float animations ── */
    @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes floatB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes floatC { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .float-a { animation: floatA 3.5s ease-in-out infinite; }
    .float-b { animation: floatB 4.2s ease-in-out infinite 0.6s; }
    .float-c { animation: floatC 3.8s ease-in-out infinite 1.2s; }
    .float-d { animation: floatB 4.5s ease-in-out infinite 0.3s; }
    .float-e { animation: floatA 3.2s ease-in-out infinite 0.9s; }

    /* ── Corner accent helper ── */
    .corner-br::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 12px; height: 12px;
      background: #9290c3;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .corner-tr::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 10px; height: 10px;
      background: #535c91;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
    }
