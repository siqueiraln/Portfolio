<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio | Desenvolvedor No-Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0eeff',
              100: '#e2deff',
              200: '#c9c4ff',
              300: '#a8a3d8',
              400: '#9290c3',
              500: '#7875b5',
              600: '#535c91',
              700: '#3d4578',
              800: '#1b1a55',
              900: '#0f1340',
              950: '#070f2b',
            },
          },
          fontFamily: {
            sans:    ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Special Gothic Expanded One"', 'system-ui', 'sans-serif'],
          },
          keyframes: {
            wiggle: {
              '0%, 100%': { transform: 'rotate(-15deg)' },
              '50%':       { transform: 'rotate(15deg)' },
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            wiggle:       'wiggle 1s ease-in-out infinite',
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* ── Gaming clip-path helpers ── */
    .clip-chamfer {
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }
    .clip-notch {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    .clip-badge {
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }
    .clip-chamfer-sm {
      clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar       { width: 6px; }
    ::-webkit-scrollbar-track { background: #070f2b; }
    ::-webkit-scrollbar-thumb { background: #535c91; }
    ::-webkit-scrollbar-thumb:hover { background: #9290c3; }

    /* ── Hero entrance animations ── */
    @keyframes heroSlideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroSlideRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Scroll reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1),
                  transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.from-left  { transform: translateX(-28px); }
    .reveal.from-right { transform: translateX(28px); }
    .reveal.fade-only  { transform: none; }
    .reveal.visible {
      opacity: 1;
      transform: translate(0, 0);
    }
    .delay-100 { transition-delay: 0.1s; }
    .delay-200 { transition-delay: 0.2s; }
    .delay-300 { transition-delay: 0.3s; }
    .delay-400 { transition-delay: 0.4s; }
    .delay-500 { transition-delay: 0.5s; }

    /* ── Float animations ── */
    @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes floatB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes floatC { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .float-a { animation: floatA 3.5s ease-in-out infinite; }
    .float-b { animation: floatB 4.2s ease-in-out infinite 0.6s; }
    .float-c { animation: floatC 3.8s ease-in-out infinite 1.2s; }
    .float-d { animation: floatB 4.5s ease-in-out infinite 0.3s; }
    .float-e { animation: floatA 3.2s ease-in-out infinite 0.9s; }

    /* ── Corner accent helper ── */
    .corner-br::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 12px; height: 12px;
      background: #9290c3;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .corner-tr::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 10px; height: 10px;
      background: #535c91;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
    }
  </style>
  <script type="module" src="/index.tsx"></script>

</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>
</body>

</html>
